<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
  <title id="title">Animated pixel engineer welcoming profile visitors</title>
  <desc id="desc">A pixel character walks through a navy terminal and greets the visitor.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset=".55" stop-color="#071a3d"/>
      <stop offset="1" stop-color="#0b2d5c"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b3b70" stop-opacity=".72"/>
      <stop offset="1" stop-color="#020617" stop-opacity=".08"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="24" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V24" fill="none" stroke="#2563eb" stroke-width="1" stroke-opacity=".2"/>
    </pattern>
  </defs>

  <rect width="900" height="320" rx="18" fill="url(#sky)"/>
  <rect x="1" y="1" width="898" height="318" rx="17" fill="none" stroke="#1d4ed8" stroke-opacity=".55"/>
  <circle cx="24" cy="22" r="5" fill="#fb7185"/>
  <circle cx="42" cy="22" r="5" fill="#fbbf24"/>
  <circle cx="60" cy="22" r="5" fill="#4ade80"/>
  <text x="450" y="27" fill="#60a5fa" font-family="monospace" font-size="12" text-anchor="middle">nasir@github: ~/profile</text>
  <path d="M0 42H900" stroke="#1e40af" stroke-opacity=".5"/>

  <g font-family="monospace" font-size="13" fill="#4ade80" opacity=".8">
    <text x="28" y="70">$ booting profile...</text>
    <text x="28" y="92">$ visitor detected <tspan fill="#93c5fd">[ok]</tspan></text>
    <text x="28" y="114">$ launching welcome.exe</text>
  </g>
  <g opacity=".52" filter="url(#glow)">
    <path d="M700 75h150M725 95h125M745 115h105" stroke="#2563eb" stroke-width="2"/>
    <circle cx="681" cy="75" r="3" fill="#4ade80"/>
    <circle cx="706" cy="95" r="3" fill="#4ade80"/>
    <circle cx="726" cy="115" r="3" fill="#4ade80"/>
  </g>

  <rect y="208" width="900" height="112" fill="url(#floor)"/>
  <rect y="208" width="900" height="112" fill="url(#grid)"/>
  <path d="M0 208H900" stroke="#3b82f6" stroke-width="2" filter="url(#glow)"/>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;430 0;250 0;0 0" keyTimes="0;.36;.68;1" dur="16s" repeatCount="indefinite"/>
    <g>
      <path d="M112 132h326a10 10 0 0 1 10 10v53a10 10 0 0 1-10 10H167l-19 18 3-18h-39a10 10 0 0 1-10-10v-53a10 10 0 0 1 10-10z" fill="#061329" stroke="#3b82f6" stroke-width="2"/>
      <rect x="102" y="132" width="5" height="73" fill="#4ade80">
        <animate attributeName="opacity" values="1;.12;1" dur=".8s" repeatCount="indefinite"/>
      </rect>
      <text x="126" y="163" font-family="monospace" font-size="14" fill="#dbeafe">
        <tspan fill="#4ade80">&gt;</tspan> Welcome - you made it to my corner.
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.27;.32;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="126" y="163" font-family="monospace" font-size="14" fill="#dbeafe" opacity="0">
        <tspan fill="#4ade80">&gt;</tspan> Here for code, ideas, or both?
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.32;.34;.61;.66;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="126" y="163" font-family="monospace" font-size="14" fill="#dbeafe" opacity="0">
        <tspan fill="#4ade80">&gt;</tspan> Look around. Let us build something.
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.66;.68;.96;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="126" y="187" font-family="monospace" font-size="11" fill="#60a5fa">- your local software engineer</text>
    </g>

    <g transform="translate(56 191)" shape-rendering="crispEdges">
      <ellipse cx="28" cy="91" rx="29" ry="6" fill="#020617" opacity=".55"/>
      <rect x="12" y="0" width="32" height="8" fill="#111827"/>
      <rect x="4" y="8" width="48" height="24" fill="#111827"/>
      <rect x="8" y="24" width="40" height="24" fill="#d69b73"/>
      <rect x="4" y="16" width="8" height="24" fill="#111827"/>
      <rect x="44" y="16" width="8" height="16" fill="#111827"/>
      <rect x="16" y="29" width="5" height="5" fill="#020617"/>
      <rect x="36" y="29" width="5" height="5" fill="#020617"/>
      <rect x="24" y="40" width="12" height="4" fill="#854d3d"/>
      <rect x="8" y="48" width="40" height="30" fill="#1d4ed8"/>
      <rect x="0" y="52" width="12" height="25" fill="#2563eb"/>
      <rect x="44" y="52" width="12" height="25" fill="#2563eb"/>
      <path d="M19 48l9 12 9-12" fill="none" stroke="#60a5fa" stroke-width="3"/>
      <rect x="25" y="60" width="6" height="6" fill="#4ade80" filter="url(#glow)"/>
      <rect x="11" y="78" width="14" height="10" fill="#0f172a">
        <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0;-3 0;0 0" dur=".55s" repeatCount="indefinite"/>
      </rect>
      <rect x="33" y="78" width="14" height="10" fill="#0f172a">
        <animateTransform attributeName="transform" type="translate" values="0 0;-3 0;0 0;3 0;0 0" dur=".55s" repeatCount="indefinite"/>
      </rect>
      <rect x="7" y="87" width="19" height="6" fill="#60a5fa"/>
      <rect x="32" y="87" width="19" height="6" fill="#60a5fa"/>
    </g>
  </g>

  <g fill="#4ade80">
    <circle cx="820" cy="175" r="2"><animate attributeName="opacity" values=".1;1;.1" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="150" r="2"><animate attributeName="opacity" values="1;.1;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="785" cy="132" r="2"><animate attributeName="opacity" values=".1;1;.1" dur="2.7s" repeatCount="indefinite"/></circle>
  </g>
</svg>
